<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Details | TaskFlow</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />

    <script src="js/redirect.js"></script>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to task details</a>
    <nav class="navbar">
      <h2>
        <a href="dashboard.html">Dashboard</a>
      </h2>

      <div>
        <a href="profile.html"> 👤 Profile </a>

        <a href="notifications.html"> Notifications </a>

        <button id="btnLogout">Logout</button>
      </div>
    </nav>

    <main id="main-content" class="container" tabindex="-1">
      <div id="taskInfo"></div>

      <!-- ================================================================ -->
      <!-- Collaborators -->
      <!-- ================================================================ -->

      <div id="collabSection">
        <h3>Collaborators</h3>

        <div id="collaborators"></div>

        <button
          type="button"
          id="btnAddCollaborator"
          class="secondary-btn"
        >
          + Add Collaborator
        </button>

        <div
          id="collaboratorPicker"
          class="collaborator-picker"
        ></div>
      </div>

      <!-- Leave Task -->
      <button
        type="button"
        id="btnLeaveTask"
      >
        Leave Task
      </button>

      <!-- ================================================================ -->
      <!-- Chat -->
      <!-- ================================================================ -->

      <h3>Chat</h3>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <!-- FOR IMAGE -->
        <input type="file" id="chatImage" accept="image/*" />
        <input type="text" id="chatInput" placeholder="Type a message..."/>
        <button id="btnSendChat">Send</button>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/task-details.js"></script>
    <script src="js/chat.js"></script>

    <script>
      redirectIfNotAuth();
      initTaskDetail();
    </script>
  </body>
</html>
