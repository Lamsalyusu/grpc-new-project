
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | TaskFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="auth-shell">
  <a class="skip-link" href="#main-content">Skip to admin sign in</a>
  <main id="main-content" class="auth-card" tabindex="-1">
    <div class="brand-badge">TaskFlow Admin</div>
    <h1>Welcome back</h1>
    <p class="auth-subtext">Secure access for workspace administrators.</p>

    <form id="adminLoginForm" class="auth-form">
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" placeholder="admin@company.com" required />

      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />

      <button type="submit" class="primary-btn">Login as Admin</button>
    </form>

    <p id="error" class="error-message"></p>

    <div class="text-link-row">
      <a href="index.html">Back to user login</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
