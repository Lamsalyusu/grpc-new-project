<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />
  </head>
  <body class="auth-shell">
    <a class="skip-link" href="#main-content">Skip to registration</a>
    <main id="main-content" class="auth-container" tabindex="-1">
      <div class="brand-badge">TaskFlow</div>
      <h1>Create your account</h1>
      <p class="auth-subtext">Bring your tasks and collaborators into one workspace.</p>
      <form id="registerForm" class="auth-form">
        <label class="field-label" for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" required />
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" required />
        <button type="submit" class="primary-btn">Create account</button>
      </form>
      <p id="error" class="error"></p>
      <p class="text-link-row">Already have an account? <a href="index.html">Sign in</a></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
