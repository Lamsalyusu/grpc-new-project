<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications | TaskFlow</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <script src="js/redirect.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to notifications</a>
    <nav class="navbar">
      <h2>
        <a href="dashboard.html">Dashboard</a>
      </h2>
      <!-- <button onclick="logout()">Logout</button>
      -->

      <button id="btnLogout">Logout</button>
    </nav>

    <main id="main-content" class="container" tabindex="-1">
      <h2>
        Notifications
        <span
          id="unreadBadge"
          class="unread-badge"
          >0</span
        >
      </h2>
      <div id="notificationStatus" class="inline-message" role="status" aria-live="polite"></div>
      <div id="notificationsList" aria-busy="true"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/notification.js"></script>
    <script>
      redirectIfNotAuth();
      loadNotifications();
      loadUnreadCount();
    </script>
  </body>
</html>
