<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css" />

    <script src="js/redirect.js"></script>
  </head>

  <body>
    <nav class="navbar">
      <h2><a href = "">Task Manager</a></h2>
      <div>
        <a href="collaboration.html">Collaborators</a>
        <a href="profile.html">Profile</a>
        <a href="notifications.html">Notifications</a>
        <button id="btnLogout">Logout</button>
      </div>
    </nav>

    <div class="container">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        "
      >
        <h2>My Tasks</h2>

        <button id="btnOpenModal">+ New Task</button>
      </div>

      <div id="filters" style="margin-bottom: 16px">
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="missing">Missing</option>
        </select>

        <select id="filterPriority">
          <option value="">All Priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <button id="btnFilter">Filter</button>
      </div>

      <div id="tasksList"></div>
      <h2 style="margin-top: 32px">Shared With Me</h2>
      <div id="sharedTasksList"></div>
    </div>

    <div class="modal-overlay" id="modal">
      <div class="modal">
        <h3>Create Task</h3>

        <form id="createTaskForm">
          <input type="text" id="title" placeholder="Title" required />

          <textarea id="description" placeholder="Description"></textarea>

          <h5>Priority</h5>

          <select id="priority">
            <option value="low">Low</option>

            <option value="medium" selected>Medium</option>

            <option value="high">High</option>
          </select>

          <h5>Due-date</h5>

          <input type="datetime-local" id="due_date" />

          <h5>Reminder-date</h5>

          <input type="datetime-local" id="reminder_at" />

          <h5>Collaborators</h5>

          <div
            id="selectedTaskCollaborators"
            style="
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin-bottom: 10px;
            "
          ></div>

          <button
            type="button"
            id="btnAddTaskCollaborator"
            style="background: #2563eb; margin-bottom: 12px"
          >
            + Add Collaborator
          </button>

          <div
            id="taskCollaboratorPicker"
            style="
              display: none;
              border: 1px solid #ddd;
              border-radius: 8px;
              padding: 10px;
              margin-bottom: 12px;
              max-height: 180px;
              overflow-y: auto;
            "
          ></div>

          <button type="submit">Create</button>

          <button type="button" id="btnCloseModal" style="background: #666">
            Cancel
          </button>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="editModal">
      <div class="modal">
        <h3>Edit Task</h3>

        <form id="editTaskForm">
          <input type="hidden" id="editId" />

          <input type="text" id="editTitle" placeholder="Title" required />

          <textarea id="editDescription" placeholder="Description"></textarea>

          <h5>Status</h5>

          <select id="editStatus">
            <option value="pending">Pending</option>

            <option value="in_progress">In Progress</option>

            <option value="completed">Completed</option>
          </select>

          <h5>Priority</h5>

          <select id="editPriority">
            <option value="low">Low</option>

            <option value="medium">Medium</option>

            <option value="high">High</option>
          </select>

          <h5>Due-date</h5>

          <input type="datetime-local" id="editDueDate" />

          <h5>Reminder-date</h5>

          <input type="datetime-local" id="editReminderAt" />

          <button type="submit">Update</button>

          <button type="button" id="btnCloseEditModal" style="background: #666">
            Cancel
          </button>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>

    <script src="js/tasks.js"></script>

    <script>
      redirectIfNotAuth();

      loadTasks();

      loadSharedTasks();

      loadTaskCollaborators();
    </script>
  </body>
</html>
