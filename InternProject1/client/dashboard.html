<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Tasks | TaskFlow</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/ui.css" />

    <script src="js/redirect.js"></script>
  </head>

  <body>
    <nav class="navbar">
          <h2><a href="">TaskFlow</a></h2>
      <div>
        <a href="collaboration.html">Collaborators</a>
        <a href="profile.html">Profile</a>
        <a href="notifications.html">Notifications</a>
        <button id="btnLogout">Logout</button>
      </div>
    </nav>

    <div class="container">
      <!-- Additional task sections -->
      <div class="dashboard-sections" aria-label="Task views">
        <a href="admin-tasks.html" class="dashboard-section-card">
          <h3>Tasks Created by Admin</h3>
          <p>View tasks assigned to you by an administrator.</p>
          <span>View Tasks →</span>
        </a>

        <a href="shared-tasks.html" class="dashboard-section-card">
          <h3>Shared With Me</h3>
          <p>View tasks shared with you by collaborators.</p>
          <span>View Shared Tasks →</span>
        </a>
      </div>

      <div class="page-section-heading">
        <div>
          <p class="page-kicker">Your workspace</p>
          <h1>My tasks</h1>
        </div>
        <button id="btnOpenModal" type="button">New task</button>
      </div>

      <div id="filters" aria-label="Filter tasks">
        <select id="filterStatus">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="missing">Missing</option>
        </select>

        <select id="filterPriority">
          <option value="">All Priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <button id="btnFilter">Filter</button>
      </div>

      <div id="tasksList"></div>
      <div id="sharedTasksList"></div>
    </div>

    <div class="modal-overlay" id="modal" role="presentation">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createTaskTitle">
        <h3 id="createTaskTitle">Create task</h3>

        <form id="createTaskForm">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Prepare project brief" required />

          <label for="description">Description</label>
          <textarea id="description" placeholder="Description"></textarea>

          <label for="priority">Priority</label>

          <select id="priority">
            <option value="low">Low</option>

            <option value="medium" selected>Medium</option>

            <option value="high">High</option>
          </select>

          <label for="due_date">Due date</label>

          <input type="datetime-local" id="due_date" />

          <label for="reminder_at">Reminder</label>

          <input type="datetime-local" id="reminder_at" />

          <h5>Collaborators</h5>

          <div
            id="selectedTaskCollaborators"
            class="selected-collaborators"
          ></div>

          <button
            type="button"
            id="btnAddTaskCollaborator"
            class="secondary-btn"
          >
            + Add Collaborator
          </button>

          <div
            id="taskCollaboratorPicker"
            class="collaborator-picker"
          ></div>

          <button type="submit">Create task</button>

          <button type="button" id="btnCloseModal" class="secondary-btn">
            Cancel
          </button>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="editModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTaskTitle">
        <h3 id="editTaskTitle">Edit task</h3>

        <form id="editTaskForm">
          <input type="hidden" id="editId" />

          <label for="editTitle">Title</label>
          <input type="text" id="editTitle" placeholder="Task title" required />

          <label for="editDescription">Description</label>
          <textarea id="editDescription" placeholder="Description"></textarea>

          <label for="editStatus">Status</label>

          <select id="editStatus">
            <option value="pending">Pending</option>

            <option value="in_progress">In Progress</option>

            <option value="completed">Completed</option>
          </select>

          <label for="editPriority">Priority</label>

          <select id="editPriority">
            <option value="low">Low</option>

            <option value="medium">Medium</option>

            <option value="high">High</option>
          </select>

          <label for="editDueDate">Due date</label>

          <input type="datetime-local" id="editDueDate" />

          <label for="editReminderAt">Reminder</label>

          <input type="datetime-local" id="editReminderAt" />

          <button type="submit">Update</button>

          <button type="button" id="btnCloseEditModal" class="secondary-btn">
            Cancel
          </button>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>

    <script src="js/tasks.js"></script>

    <script>
      redirectIfNotAuth();

      loadTasks();

      // loadSharedTasks();

      // loadTaskCollaborators();
    </script>
  </body>
</html>
