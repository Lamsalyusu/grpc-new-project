<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src = 'js/redirect.js'></script>
</head>
<body>
  <nav class="navbar">
    <h2>Task Manager</h2>
    <div>
      <a href="profile.html">👤 Profile</a>
      <a href="notifications.html">🔔 Notifications</a>
      <button id="btnLogout">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2>My Tasks</h2>
      <button id="btnOpenModal">+ New Task</button>
    </div>

    <div id="filters" style="margin-bottom:16px;">
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <select id="filterPriority">
        <option value="">All Priority</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="btnFilter">Filter</button>
    </div>

    <div id="tasksList"></div>
    <h2 style="margin-top:32px;">Shared With Me</h2>
    <div id="sharedTasksList"></div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>Create Task</h3>
      <form id="createTaskForm">
        <input type="text" id="title" placeholder="Title" required />
        <textarea id="description" placeholder="Description"></textarea>
        
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="datetime-local" id="due_date" />
        <input type="datetime-local" id="reminder_at" />
        <button type="submit">Create</button>
        <!-- FIX: Added type="button" to prevent form submission -->
        <button type="button" id="btnCloseModal" style="background:#666;">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>Edit Task</h3>
      <form id="editTaskForm">
        <input type="hidden" id="editId" />
        <input type="text" id="editTitle" placeholder="Title" required />
        <textarea id="editDescription" placeholder="Description"></textarea>
        <select id="editStatus">
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <select id="editPriority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <input type="datetime-local" id="editDueDate" />
        <input type="datetime-local" id="editReminderAt" />
        <button type="submit">Update</button>
        <!-- FIX: Added type="button" to prevent form submission -->
        <button type="button" id="btnCloseEditModal" style="background:#666;">Cancel</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/tasks.js"></script>
  <!-- FIX: Removed logout() from initial page load script string -->
  <script>
    redirectIfNotAuth(); 
    loadTasks(); 
    loadSharedTasks();
  </script>
</body>
</html>
