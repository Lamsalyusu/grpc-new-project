<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | TaskFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="auth-shell">
  <div class="auth-container">
    <div class="brand-badge">TaskFlow</div>
    <h1>Welcome back</h1>
    <p class="auth-subtext">Sign in to pick up where your team left off.</p>
    <form id="loginForm" class="auth-form">
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
      <button type="submit" class="primary-btn">Sign in</button>
    </form>
    <p id="error" class="error"></p>
    <p class="text-link-row">New to TaskFlow? <a href="register.html">Create an account</a></p>
    <p class="text-link-row">Administrator? <a href="admin-login.html">Admin sign in</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
