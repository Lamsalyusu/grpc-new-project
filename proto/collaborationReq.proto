syntax = "proto3";
package collaborationPackage;
// import "auth.proto";

service collaborationService{
    rpc sendRequest(friendRequest) returns (requestStatus);
    rpc seeRequest(seeReq) returns (requests);
    rpc acceptRequest(acceptReq) returns (acceptResponse);
    rpc rejectRequest(rejectReq) returns (rejectResponse);
    rpc removeCollaborators(removeReq) returns (removeResponse);
    rpc viewCollaborators(collaboratorsView) returns (viewResponse);
}


// ----------------------------------------------
message friendRequest{
    // string sender_id=1;
    // string receiver_id=1;
    string receiver_email = 1;
}

message requestStatus{
    string id =1;
    string sender_id = 2;
    string receiver_id = 3;
    string status = 4;
    string sender_name = 5;
    // string somethin = 5;
}
// -----------------------------------------------

message seeReq{
    // string sender_id =1;
    // string receiver_id = 2;
}

message requests{
   repeated requestStatus reqs = 1;
}
// ---------------------------------------------
message acceptReq{
    string id = 1;
    // string sendeid = 1;
    // string receiver_id = 2;
}

message acceptResponse {
    repeated requestStatus accept = 1;
}
// ----------------------------------------------

message rejectReq{
    string id = 1;
    // string sender_id = 1;
    // string receiver_id = 2;
}

message rejectResponse{
   repeated requestStatus reject = 1;
}
// ----------------------------------------------

message removeReq{
    string targetUserId =1;
}

message removeResponse{
string message =1;
}

// 

message collaborator {
    string id = 1;
    string name = 2;
    string email = 3;
}

message collaboratorsView{

}

message viewResponse{
    repeated collaborator collaborators = 1;
}