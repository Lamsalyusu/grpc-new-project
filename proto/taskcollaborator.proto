syntax = "proto3";
package taskCollaboratorPackage;

service taskCollaboratorService {

    rpc createCollaborator(createCollaboratorReq) returns (createCollaboratorRes);
    rpc getCollaborators(getCollaboratorReq) returns (getCollaboratorRes);
    rpc deleteCollaborator(delCollaboratorsReq) returns (delCollaboratorRes);
    rpc getSharedTasks(getSharedTaskReq) returns (getSharesTaskRes);
    rpc leaveTask(leaveTaskReq) returns (leaveTaskRes);

}

message User {
    string id = 1;
    string name = 2;
    string email = 3;
}

message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  string status = 4;
  string priority = 5;
  string owner_id = 6;
  string due_date = 7;
  string reminder_at =8;
}

message createCollaboratorReq {
    string task_id = 1;
    // string email = 2;
    string user_id=2;
}

message createCollaboratorRes {
    string user_id = 1;
    string task_id = 2;
    string created_at =3;
    string message =4;
}

message getCollaboratorReq {
    string task_id = 1;
}

message getCollaboratorRes {
    string task_id =1;
    repeated User collaborators = 2;
}

message delCollaboratorsReq{
    string task_id = 1;
    string user_id = 2;
}

message delCollaboratorRes {
    string message = 1;
}

message getSharedTaskReq{   
}

message getSharesTaskRes{
    repeated Task tasks = 1;
}

message leaveTaskReq {
    string task_id = 1;
    string user_id = 2;
    // string owner_id = 3;
}

message leaveTaskRes {
    string message = 1;
}